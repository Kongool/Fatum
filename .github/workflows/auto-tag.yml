name: Auto-tag on version bump

# Whenever main moves, read the plugin version from Directory.Build.props. If that
# version has no matching v* tag yet, tag it and start release.yml. Commit without a
# version bump and nothing happens.
#
# Tags pushed with GITHUB_TOKEN don't trigger other workflows, so the release is
# started explicitly: workflow_dispatch is an event GITHUB_TOKEN can fire. That means
# no personal access token is needed, and no double release either.

on:
  push:
    branches:
      - main

concurrency:
  group: auto-tag-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: "!contains(toJson(github.event.commits.*.message), '[skip auto-tag]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read plugin version from Directory.Build.props
        id: version
        run: |
          version=$(grep -oP '<Version>\K[\d.]+(?=</Version>)' Directory.Build.props)
          if [ -z "$version" ]; then
            echo "::error::Could not parse <Version> from Directory.Build.props"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $version"

      - name: Check whether tag already exists
        id: check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists - nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG does not exist yet - will create."
          fi

      - name: Create tag and start the release
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          if git push origin "$TAG"; then
            gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
            echo "Pushed tag $TAG and started the release."
          elif git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $2}' | grep -qx "refs/tags/$TAG"; then
            echo "Tag $TAG was created by another run - nothing to do."
          else
            echo "::error::Failed to push tag $TAG"
            exit 1
          fi
